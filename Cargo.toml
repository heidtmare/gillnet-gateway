[package]
name = "gillnet-gateway"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.15.0"
actix-web-lab = "0.27.0"
actix-ws = "0.4.0"
awc = "3.8.2"
bytes = "1.12.1"
bytestring = "1.5.1"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros"] }
yaml_serde = "0.10.7"
