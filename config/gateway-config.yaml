listen:
  # End-user traffic. Expose this one.
  proxy-port: 8080
  # Service self-registration. Cluster-internal only — do NOT expose via Ingress.
  registration-port: 8081

registration:
  # An instance is evicted if it has not heartbeat within this window.
  heartbeat-ttl-seconds: 30
  reap-interval-seconds: 10

proxy:
  # Upstream response timeout -> 504. Connect failures -> 502.
  # Does not apply to websockets, which are long-lived by design.
  timeout-seconds: 30
  connect-timeout-seconds: 5
  # Larger frames close the connection with 1009. Applies to both directions.
  websocket-max-frame-bytes: 65536

# Statically declared backends. These cannot self-register, and they win over
# any dynamic registration that claims the same name.
# services:
#   - name: my-token-svc
#     url: "http://my-token-application-svc.local:8080"

# Auth policies. Credentials live here only, sourced from the environment —
# self-registering services reference a policy by name, they never supply one.
# A referenced $VAR that is unset is a startup error, not an empty secret.
plugins:
  - name: my-token-plugin
    type: token-plugin
    params:
      # Checked after "Authorization: Bearer", in this order.
      keys: [api-key]
      tokens: [$MY_TOKEN]

  - name: my-jwt-plugin
    type: jwt-plugin
    params:
      secret: $JWT_SECRET
      # issuer/audience are optional; when set they are enforced.
      # issuer: https://auth.example.com
      # audience: gillnet
      roles-claim: roles

# Static routes. A route whose `url` is not http(s):// is a service reference,
# resolved against static `services:` first, then the self-registration registry —
# so a static route can point at a name that pods fill in at runtime.
routes:
  - name: ui-route
    url: "http://my-application-ui.local:8080"
    paths: [/index, /home, /landing]
    strip-path: true

  - name: tkn-svc-route
    url: my-token-svc
    paths: [/check]
    strip-path: true
    plugins:
      - name: my-token-plugin

  - name: my-application-svc-user-route
    url: my-application-svc
    paths: [/svc/user]
    plugins:
      - name: my-jwt-plugin
        params:
          roles: [user]

  - name: my-application-svc-admin-route
    url: my-application-svc
    paths: [/svc/admin]
    plugins:
      - name: my-jwt-plugin
        params:
          roles: [admin]
          # {claim} is substituted from the verified token. Any client-sent
          # copy of these headers is dropped before forwarding.
          insert-headers:
            "USER-ID": "{sub}"
            "USER-EMAIL": "{email}"
