listen:
  # End-user traffic. Expose this one.
  proxy-port: 8080
  # Service self-registration. Cluster-internal only — do NOT expose via Ingress.
  registration-port: 8081

registration:
  # An instance is evicted if it has not heartbeat within this window.
  heartbeat-ttl-seconds: 30
  reap-interval-seconds: 10

proxy:
  # Upstream response timeout -> 504. Connect failures -> 502.
  timeout-seconds: 30
  connect-timeout-seconds: 5

# Statically declared backends. These cannot self-register, and they win over
# any dynamic registration that claims the same name.
# services:
#   - name: my-token-svc
#     url: "http://my-token-application-svc.local:8080"

# plugins:

# - name: my-oauth-plugin
#   type: oauth2-plugin
#   params:
#     base-url: $MY_OAUTH_BASE_URL
#     client-id: $MY_OAUTH_CLIENT_ID
#     client-secret: $MY_OAUTH_CLIENT_SECRET

# - name: my-token-plugin
#   type: token-plugin
#   params:
#     keys: [api-key]
#     tokens: [ $MY_TOKEN ]

# Static routes. A route whose `url` is not http(s):// is a service reference,
# resolved against static `services:` first, then the self-registration registry —
# so a static route can point at a name that pods fill in at runtime.
routes:
  - name: ui-route
    url: "http://my-application-ui.local:8080"
    paths: [/index, /home, /landing]
    strip-path: true

  - name: tkn-svc-route
    url: my-token-svc
    paths: [/check]
    strip-path: true
    plugins:
      - name: my-token-plugin

  - name: my-application-svc-user-route
    url: my-application-svc
    paths: [/svc/user]
    plugins:
      - name: my-oauth-plugin
        params:
          roles: [user, admin]

  - name: my-application-svc-admin-route
    url: my-application-svc
    paths: [/svc/admin]
    plugins:
      - name: my-oauth-plugin
        params:
          roles: [admin]
          insert-headers:
            "USER-ID": "{user-id}"
            "USER-EMAIL": "{user-email}"
