listen:
  # End-user traffic. Expose this one.
  proxy-port: 8080
  # Service self-registration. Cluster-internal only — do NOT expose via Ingress.
  registration-port: 8081

registration:
  # An instance is evicted if it has not heartbeat within this window.
  heartbeat-ttl-seconds: 30
  reap-interval-seconds: 10

proxy:
  # Upstream response timeout -> 504. Connect failures -> 502.
  # Does not apply to websockets, which are long-lived by design.
  timeout-seconds: 30
  connect-timeout-seconds: 5
  # Larger frames close the connection with 1009. Applies to both directions.
  websocket-max-frame-bytes: 65536

# Statically declared backends. These cannot self-register, and they win over
# any dynamic registration that claims the same name.
# services:
#   - name: my-token-svc
#     url: "http://my-token-application-svc.local:8080"

# Auth policies. Credentials live here only, sourced from the environment —
# self-registering services reference a policy by name, they never supply one.
# A referenced $VAR that is unset is a startup error, not an empty secret.
plugins:
  - name: my-token-plugin
    type: token-plugin
    params:
      # Checked after "Authorization: Bearer", in this order.
      keys: [api-key]
      tokens: [$MY_TOKEN]

  - name: my-jwt-plugin
    type: jwt-plugin
    params:
      secret: $JWT_SECRET
      # issuer/audience are optional; when set they are enforced.
      # issuer: https://auth.example.com
      # audience: gillnet
      roles-claim: roles
      # Also accept the token out of this cookie, after Authorization and any
      # `keys:` header. This is the other half of the oauth-plugin's
      # `session-cookie:` below: same secret, same issuer/audience checks, so a
      # browser that logged in once at the oauth-guarded route reaches these
      # routes without another introspection call. The cookie is stripped from
      # the forwarded `Cookie` header -- and only that cookie; the rest of the
      # jar is the application's and goes through untouched.
      cookie: gillnet-session

  # Asks an external provider about each token (RFC 7662 introspection, then
  # UserInfo for profile claims). Results are cached until the token's own exp,
  # capped at cache-max-seconds. If the provider cannot be reached the request
  # is refused with 503 rather than allowed through.
  - name: my-oauth-plugin
    type: oauth2-plugin
    params:
      introspection-url: $MY_OAUTH_INTROSPECTION_URL
      userinfo-url: $MY_OAUTH_USERINFO_URL
      client-id: $MY_OAUTH_CLIENT_ID
      client-secret: $MY_OAUTH_CLIENT_SECRET
      roles-claim: scope
      timeout-seconds: 5
      cache-max-seconds: 60
      cache-negative-seconds: 5
      cache-max-entries: 10000
      # Hand the caller a session once the provider has vouched for them. The
      # cookie holds the verified claims as an HS256 token, so `my-jwt-plugin`
      # above verifies it with no second format and no call to anyone. Omit the
      # whole block and no cookie is ever set.
      #
      # The trade is the one jwt-plugin always makes: a session is not
      # revocable, so ttl-seconds is the window in which a revoked token still
      # opens the routes guarded by the jwt-plugin. It is capped by the token's
      # own exp -- a session never outlives the credential it came from -- and
      # routes that cannot tolerate the gap should keep the oauth2-plugin,
      # which asks the provider every time and never accepts this cookie back.
      session-cookie:
        # Must be the jwt-plugin's `secret:`, or nothing can read what this mints.
        secret: $JWT_SECRET
        name: gillnet-session
        ttl-seconds: 3600
        path: /
        # domain: example.com
        # Both default to true; a session is HttpOnly and Secure unless a
        # config says otherwise.
        secure: true
        http-only: true
        # Strict, Lax (default) or None. None requires secure: true, since a
        # browser would otherwise discard the cookie outright.
        same-site: Lax
        # Stamped into the minted token, to satisfy a jwt-plugin that enforces
        # them. Leave out if it does not.
        # issuer: https://auth.example.com
        # audience: gillnet

  # Test scaffolding. MUST NOT appear in a production config.
  #
  # Declared *in place of* the plugin it stands in for -- same `name:`, so the
  # routes referencing it do not change -- it turns a token into whatever claim
  # set was posted for it. No introspection, no UserInfo call, so a route can be
  # exercised with no identity provider reachable, with the roles and
  # insert-headers it is configured with in production.
  #
  # To test the oauth-guarded routes below, change `my-oauth-plugin`'s type to
  # testing-plugin and nothing else. To go back, change it back.
  #
  # It is a complete bypass of authentication: anyone who can reach its endpoint
  # can mint any identity, including any role. There is no flag that leaves this
  # quietly on -- declaring it is the whole of it -- and the gateway warns at
  # startup and reports it under `summary.testingPlugins` in
  # /registry/describe.
  #
  #   POST   /testing/userinfo        {"token": "...", "claims": {...}}  replace
  #   PATCH  /testing/userinfo        {"token": "...", "claims": {...}}  merge
  #                                   (a null claim value removes the claim)
  #   GET    /testing/userinfo        list overrides (ids, never the tokens)
  #   GET    /testing/userinfo/{id}   one override
  #   DELETE /testing/userinfo/{id}   drop one
  #   DELETE /testing/userinfo        drop all
  #
  # `id` is the token's SHA-256, so it can be pasted around safely. An `exp`
  # claim in the past is still honoured, which is how expiry gets tested.
  # - name: my-oauth-plugin
  #   type: testing-plugin
  #   params:
  #     # Mounted on the PUBLIC proxy port, shadowing any route under the same
  #     # prefix. Defaults to /testing/userinfo.
  #     endpoint: /testing/userinfo
  #     # Match the plugin being stood in for, so routes behave identically.
  #     roles-claim: scope
  #     keys: [api-key]
  #     # Stands in for the oauth-plugin's session too: same block, same cookie,
  #     # so the jwt-guarded routes behind a login work with no IdP reachable.
  #     #
  #     # Unlike the real thing this also reads the cookie back, and reads it as
  #     # a BASELINE: the claims in the session, with whatever was registered
  #     # for the token layered over them. So a test logs in once and then
  #     # varies one claim -- POST {"token": "...", "claims": {"scope": "admin"}}
  #     # -- and the rest of the identity keeps coming from the cookie. A past
  #     # `exp` registered this way ends a live session on the spot.
  #     #
  #     # A cookie it did not sign is still refused: the endpoints are the way
  #     # to mint an identity here, not a handmade cookie.
  #     session-cookie:
  #       secret: $JWT_SECRET
  #       name: gillnet-session

  # A WebAssembly filter. The module is compiled once at startup; a missing
  # file or a module that does not export the ABI is a startup failure, not a
  # surprise 500 on the first request that reaches the route.
  #
  # `settings` is the only thing crossing into the module. A route referencing
  # this plugin may layer its own `settings` over these -- mappings merge key by
  # key, anything else is replaced -- so one module serves many routes with
  # different configuration. /registry/describe reports the merged result per
  # route, which is what the module will actually be handed.
  #
  # Filters run AFTER the auth plugins on a route, whatever order the route
  # lists them in: a module should never see a request that failed auth.
  #
  # See plugins/README.md for the ABI and a worked example.
  # - name: my-wasm-plugin
  #   type: wasm-plugin
  #   params:
  #     # $VAR is expanded, so a deployment can point at a mounted volume.
  #     path: ./plugins/header-policy/target/wasm32-unknown-unknown/release/header_policy.wasm
  #     # Instructions one call may execute before it is killed. A module that
  #     # loops forever trips this and fails the request; it does not hang a
  #     # worker. Default 10000000, roughly a few milliseconds.
  #     fuel: 10000000
  #     # Ceiling on the module's linear memory. Default 16 MiB.
  #     memory-max-bytes: 16777216
  #     # What happens when the module itself fails -- traps, runs out of fuel,
  #     # returns junk. Default false: the filter reached no decision, so the
  #     # request is refused with 500 rather than forwarded past whatever the
  #     # filter was there to enforce. Set true only for filters that are
  #     # decorative (a header stamp, telemetry), never for ones that gate.
  #     fail-open: false
  #     settings:
  #       require:
  #         x-api-version: "*"
  #       set:
  #         x-gateway: gillnet

# Static routes.
#
# A guarded route strips the credential it authenticated with -- Authorization,
# any header named in the plugin's `keys:`, and any cookie named in its
# `cookie:` or `session-cookie:` -- before forwarding, so a backend is never
# handed a token it could replay elsewhere. Cookies go one at a time: the rest
# of the jar belongs to the application and is forwarded untouched. Set
# `forward-token: true` on routes whose backend genuinely needs it (it wants to
# read claims itself, or it calls another API on the user's behalf).
# Unguarded routes are untouched pass-throughs; there is no credential the
# gateway consumed, so there is none to withhold.
#
# A route whose `url` is not http(s):// is a service reference,
# resolved against static `services:` first, then the self-registration registry —
# so a static route can point at a name that pods fill in at runtime.
routes:
  # The door. A caller arrives with a provider token, the oauth-plugin asks the
  # provider about it, and the response carries back a session cookie -- after
  # which the jwt-guarded routes below open to the same browser with no further
  # introspection. Guarded by the oauth-plugin rather than the jwt-plugin on
  # purpose: this is the one route where the provider is asked every time.
  # - name: login-route
  #   url: my-application-svc
  #   paths: [/login]
  #   plugins:
  #     - name: my-oauth-plugin

  - name: ui-route
    url: "http://my-application-ui.local:8080"
    paths: [/index, /home, /landing]
    strip-path: true

  - name: tkn-svc-route
    url: my-token-svc
    paths: [/check]
    strip-path: true
    plugins:
      - name: my-token-plugin

  - name: my-application-svc-user-route
    url: my-application-svc
    paths: [/svc/user]
    # This backend reads the JWT itself, so it needs the original header.
    forward-token: true
    plugins:
      - name: my-jwt-plugin
        params:
          roles: [user]

  - name: my-application-svc-admin-route
    url: my-application-svc
    paths: [/svc/admin]
    plugins:
      - name: my-jwt-plugin
        params:
          roles: [admin]
          # {claim} is substituted from the verified token. Any client-sent
          # copy of these headers is dropped before forwarding.
          insert-headers:
            "USER-ID": "{sub}"
            "USER-EMAIL": "{email}"

  # A route may mix both kinds. The guard runs first; only if it passes does
  # the module see the request. A header the module sets is the gateway's, so
  # any copy the client sent is dropped before forwarding -- the same rule that
  # protects insert-headers above.
  # - name: my-filtered-route
  #   url: my-application-svc
  #   paths: [/svc/things]
  #   plugins:
  #     - name: my-jwt-plugin
  #       params:
  #         roles: [user]
  #     - name: my-wasm-plugin
  #       params:
  #         # Layered over the plugin's own settings; `set` above survives
  #         # because mappings merge rather than replace.
  #         settings:
  #           require:
  #             x-api-version: "2"
